# DigitalOcean App Platform spec for Planet: a free static site (Next.js static export) built from GitHub.
# Create with:  doctl apps create --spec .do/app.yaml   (the repo must be authorised under DigitalOcean > Settings > GitHub)
# `branch` is main: merge feature/supabase-persistence first (or temporarily point branch at it to preview).
# The two NEXT_PUBLIC_SUPABASE_* values are placeholders: set the real ones as build-time variables in the DO
# dashboard (or a local copy of this spec). The anon key is designed to be public, but keep it out of git anyway.
name: planet
region: syd
static_sites:
  - name: planet-web
    github:
      repo: RalphLavelle/Planet
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build:static
    output_dir: .next-export
    error_document: 404.html
    envs:
      - key: NEXT_PUBLIC_SUPABASE_URL
        scope: BUILD_TIME
        value: https://YOUR-PROJECT-REF.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        scope: BUILD_TIME
        value: REPLACE_WITH_SUPABASE_ANON_KEY
